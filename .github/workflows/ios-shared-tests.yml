name: Shared Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-tests:
    name: Run shared unit tests on the iOS simulator
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      KOTLIN_DAEMON_JVMARGS: -Xmx2048M
      NUVIO_GRADLE_JVMARGS: -Xmx4608M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768M
      NUVIO_KOTLIN_NATIVE_JVMARGS: -Xmx4608M
      NUVIO_IOS_DISTRIBUTION: full
      RELEASE_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin Native
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure runtime properties
        if: env.RELEASE_PROPERTIES_BASE64 != ''
        run: |
          printf '%s' "${RELEASE_PROPERTIES_BASE64}" | base64 --decode > local.properties
          sed -i '' -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties

      - name: Prepare iOS dependencies
        run: ./scripts/prepare-ios-dependencies.sh

      - name: Run commonTest on the iOS simulator
        run: ./gradlew :composeApp:iosSimulatorArm64Test --stacktrace

      - name: Summarise failing tests
        if: failure()
        run: |
          {
            echo '### Failing shared tests'
            grep -rl '<failure' composeApp/build/test-results 2>/dev/null || echo 'no test-results XML with failures found'
            echo '--- messages ---'
            grep -rh -A8 '<failure' composeApp/build/test-results 2>/dev/null | head -300 || true
          } || true

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: shared-test-reports-${{ github.sha }}
          path: composeApp/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
