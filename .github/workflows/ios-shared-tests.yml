name: Shared Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-tests:
    name: Run shared unit tests on the iOS simulator
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      KOTLIN_DAEMON_JVMARGS: -Xmx2048M
      NUVIO_GRADLE_JVMARGS: -Xmx4608M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768M
      NUVIO_KOTLIN_NATIVE_JVMARGS: -Xmx4608M
      NUVIO_IOS_DISTRIBUTION: full
      RELEASE_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin Native
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure runtime properties
        if: env.RELEASE_PROPERTIES_BASE64 != ''
        run: |
          printf '%s' "${RELEASE_PROPERTIES_BASE64}" | base64 --decode > local.properties
          sed -i '' -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties

      - name: Prepare iOS dependencies
        run: ./scripts/prepare-ios-dependencies.sh

      - name: Run commonTest on the iOS simulator
        run: |
          set -o pipefail
          ./gradlew :composeApp:iosSimulatorArm64Test --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-test.log"

      # Annotations are what a reader of the run page (and of the checks API) sees first, so the
      # reason and the first failure message are lifted out of the log instead of scrolling in it.
      - name: Summarise the failure
        if: failure()
        run: |
          set +e
          results=composeApp/build/test-results
          files=$(grep -rl '<failure' "$results" 2>/dev/null | sort)
          if [ -z "$files" ]; then
            reason=$(sed -n '/What went wrong/,/^\* Try/p' "$RUNNER_TEMP/gradle-test.log" | head -12 | tr '\n' ' ')
            echo "::error title=Gradle failure (no test XML)::${reason:0:900}"
            exit 0
          fi
          cases=$(grep -rho '<testcase ' "$results" | wc -l | tr -d ' ')
          fails=$(grep -rho '<failure' "$results" | wc -l | tr -d ' ')
          files_count=$(echo "$files" | wc -l | tr -d ' ')
          echo "::error title=Shared tests summary::$cases cases, $fails failures across $files_count files"
          while read -r file; do
            message=$(grep -o '<failure message="[^"]*"' "$file" | head -1 | sed 's/<failure message="//; s/"$//' | cut -c1-600)
            echo "::error title=$(basename "$file" .xml)::$message"
          done <<< "$(echo "$files" | head -6)"
          first=$(echo "$files" | head -1)
          trace=$(grep -A5 '<failure' "$first" | sed -n '2,5p' | tr -s ' \t' ' ' | tr '\n' '|' | cut -c1-800)
          echo "::error title=First stack trace from $(basename "$first" .xml)::${trace}"
          exit 0

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: shared-test-reports-${{ github.sha }}
          path: composeApp/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
